# .github/workflows/newsletter.yml
#
# Disparo MANUAL da newsletter via GitHub Actions.
# Para enviar: Actions → Disparar Newsletter → Run workflow → informe o slug
#
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#   RESEND_API_KEY      → chave da API do Resend
#   RESEND_AUDIENCE_ID  → ID da audience no Resend

name: Disparar Newsletter

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do post (ex: educacao-financeira-2026)'
        required: true

jobs:
  newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install gray-matter marked

      - name: Definir post pelo slug informado
        id: detect
        run: |
          FILE="posts/${{ github.event.inputs.slug }}.md"
          if [ ! -f "$FILE" ]; then
            echo "Arquivo não encontrado: $FILE"
            exit 1
          fi
          echo "files=$FILE" >> $GITHUB_OUTPUT

      - name: Enviar newsletter
        env:
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          ADDED_FILES:        ${{ steps.detect.outputs.files }}
        run: node scripts/send-newsletter.js
