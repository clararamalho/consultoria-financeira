<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada · Clara Ramalho Consultoria Financeira</title>
  <meta name="robots" content="noindex, nofollow" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="645309d9-1add-4b4c-9d0a-738a3a38b8c2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white:       #FFFFFF;
      --off-white:   #F7F8FC;
      --surface-2:   #EDEEF5;
      --border:      rgba(26,42,108,0.1);
      --border-2:    rgba(26,42,108,0.06);
      --ink:         #1A2A6C;
      --ink-2:       #5A6785;
      --ink-3:       #9AA3B8;
      --ciano:       #00B4D8;
      --radius:      0.625rem;
      --nav-h:       56px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--ink);
      font-weight: 300;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: var(--nav-h);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .logo {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.25rem;
      position: relative;
    }
    .erro-tag {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      font-family: monospace;
      margin-bottom: 1.5rem;
    }
    .numero-404 {
      font-size: clamp(5rem, 14vw, 9rem);
      font-weight: 300;
      letter-spacing: -0.05em;
      line-height: 0.95;
      background: linear-gradient(135deg, var(--ink) 0%, var(--ciano) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1.5rem;
    }
    main h1 {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 300;
      color: var(--ink);
      letter-spacing: -0.03em;
      line-height: 1.15;
      max-width: 520px;
      margin-bottom: 1rem;
      text-wrap: balance;
    }
    main p {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--ink-2);
      max-width: 440px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }
    .btns {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 300;
      padding: 0.8rem 1.4rem;
      border-radius: var(--radius);
      text-decoration: none;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .btn:hover {
      background: var(--surface-2);
      border-color: transparent;
    }
    .btn svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 0.75; stroke-linecap: square;
    }
    footer {
      padding: 1.5rem 1.25rem;
      border-top: 1px solid var(--border-2);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 300;
      color: var(--ink-3);
    }
    @media (max-width: 520px) {
      .btns { flex-direction: column; align-items: stretch; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Clara Ramalho · Consultoria Financeira</a>
  </header>
  <main>
    <span class="erro-tag">Erro 404</span>
    <div class="numero-404">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Veja por onde quer continuar.</p>
    <div class="btns">
      <a href="index.html" class="btn">
        Ir para o início
        <svg viewBox="0 0 14 14"><path d="M7.875 2.625 12.25 7m0 0-4.375 4.375M12.25 7H1.75"/></svg>
      </a>
      <a href="blog.html" class="btn">
        Ver newsletter
        <svg viewBox="0 0 14 14"><path d="M7.875 2.625 12.25 7m0 0-4.375 4.375M12.25 7H1.75"/></svg>
      </a>
    </div>
  </main>
  <footer>
    © 2026 Clara Ramalho · Consultoria Financeira
  </footer>
</body>
</html>
