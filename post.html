<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1A2A6C" />
  <title id="pageTitle">Post · Clara Ramalho Consultoria Financeira</title>
  <meta name="description" content="" id="metaDesc" />
  <link rel="canonical" href="https://clararamalho.com.br/post.html" id="canonicalLink" />
  <meta property="og:image" content="https://clararamalho.com.br/assets/og-cover.jpg" id="og-image-meta" />
  <meta property="og:title" content="Newsletter · Clara Ramalho Consultoria Financeira" id="ogTitle" />
  <meta property="og:description" content="" id="ogDesc" />
  <meta property="og:url" content="https://clararamalho.com.br/post.html" id="ogUrl" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Clara Ramalho · Consultoria Financeira" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://clararamalho.com.br/assets/og-cover.jpg" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://cdn.jsdelivr.net https://cloud.umami.is https://api-gateway.umami.dev https://newsletter-cadastro.m-clarard.workers.dev https://formulario-contato.m-clarard.workers.dev; frame-ancestors 'none';" />

  <link rel="stylesheet" href="assets/global.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    /* ── LOADING / ERRO ── */
    .page-loading {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--ink-2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .page-erro {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }
    .page-erro h2 {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 0.75rem;
      color: var(--ink);
    }
    .page-erro p {
      color: var(--ink-2);
      font-size: 0.9375rem;
      margin-bottom: 2rem;
    }
    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      color: var(--ink-2);
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-voltar:hover { color: var(--ink); border-color: var(--ink); }

    /* ── BREADCRUMB ── */
    .breadcrumb {
      max-width: var(--max);
      margin: 0 auto;
      padding: 3rem 2rem 0;
    }
    .breadcrumb ol {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.375rem;
      list-style: none;
    }
    .breadcrumb li {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .breadcrumb a, .breadcrumb span {
      font-size: 0.6875rem;
      font-family: 'Inter', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-3);
    }
    .breadcrumb a:hover { color: var(--ink-2); }
    .breadcrumb .sep { color: var(--ink-3); }

    /* ── POST HERO ── */
    .post-hero {
      max-width: var(--max);
      margin: 0 auto;
      padding: 2.5rem 2rem 0;
    }
    .post-categoria {
      display: inline-block;
      font-size: 0.6875rem;
      font-family: 'Inter', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ciano);
      margin-bottom: 1.25rem;
    }
    .post-titulo {
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 300;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
      max-width: 48rem;
      margin-bottom: 1.25rem;
    }
    .post-resumo-hero {
      font-size: 1.0625rem;
      font-weight: 300;
      color: var(--ink-2);
      max-width: 40rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }
    .post-meta {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }
    .post-meta-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      font-family: 'Inter', monospace;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-3);
    }
    .post-meta-item svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none; stroke-width: 1.5;
    }

    /* ── LAYOUT PRINCIPAL ── */
    .post-layout {
      max-width: var(--max);
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
      display: flex;
      gap: 3.5rem;
      align-items: flex-start;
    }
    .post-sidebar {
      width: 18rem;
      flex-shrink: 0;
      position: sticky;
      top: calc(var(--nav-h) + 2rem);
    }
    .sidebar-card {
      background: var(--off-white);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .sidebar-autora {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .sidebar-avatar {
      width: 3rem;
      height: 3rem;
      border-radius: 50%;
      border: 2px solid var(--ciano);
      object-fit: cover;
    }
    .sidebar-bio {
      font-size: 0.875rem;
      font-weight: 300;
      color: var(--ink-2);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .sidebar-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.8125rem;
      font-weight: 300;
      color: var(--text-primary);
      background: var(--surface);
      cursor: pointer;
      width: 100%;
      justify-content: center;
    }

    /* Artigo */
    .post-main { flex: 1; min-width: 0; }
    .post-content { line-height: 1.75; }
    .post-content h2 { font-size: 1.25rem; font-weight: 400; margin: 2.5rem 0 1rem; }
    .post-content p { font-size: 1rem; font-weight: 300; margin-bottom: 1.5rem; }
    .post-content strong { font-weight: 500; }

    /* Navegação */
    .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 3rem; }
    .post-nav-item { padding: 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); }
    .post-nav-item.next { text-align: right; }

    /* Sticky CTA */
    .post-sticky-cta {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      z-index: 400;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.03);
    }
    .post-sticky-cta.visible { display: flex; }

    #voltarTopo {
      position: fixed;
      bottom: 1.5rem; right: 1.5rem;
      width: 2.25rem; height: 2.25rem;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.3s;
    }
    #voltarTopo.visible { opacity: 1; }

    @media (max-width: 900px) {
      .post-layout { flex-direction: column; }
      .post-sidebar { width: 100%; position: static; }
    }
  </style>
  <script defer src="assets/site-nav.js"></script>
</head>
<body>

  <header class="site-main-header" id="siteNavHeader">
    <div class="site-nav-inner">
      <div class="site-nav-left">
        <a href="index.html" class="site-nav-logo">Clara Ramalho</a>
      </div>
    </div>
  </header>

  <div class="page-loading" id="postLoading">Carregando...</div>

  <div class="page-erro" id="postErro" style="display:none;">
    <div>
      <h2>Post não encontrado</h2>
      <p>O conteúdo que você está procurando não existe ou foi removido.</p>
      <a href="newsletter.html" class="btn-voltar">← Voltar para a Newsletter</a>
    </div>
  </div>

  <div id="postWrapper" style="display:none;">
    <nav class="breadcrumb">
      <ol>
        <li><a href="index.html">Início</a> / </li>
        <li><a href="newsletter.html">Newsletter</a> / </li>
        <li><span id="breadcrumbTitulo"></span></li>
      </ol>
    </nav>

    <section class="post-hero">
      <span class="post-categoria" id="postTag"></span>
      <h1 class="post-titulo" id="postTitulo"></h1>
      <p class="post-resumo-hero" id="postResumo"></p>
      <div class="post-meta">
        <span id="postData"></span>
      </div>
    </section>

    <div class="post-layout">
      <aside class="post-sidebar">
        <div class="sidebar-card">
          <p class="nome">Clara Ramalho</p>
          <p class="sidebar-bio">Consultora financeira independente.</p>
        </div>
      </aside>

      <main class="post-main">
        <article class="post-content" id="postContent"></article>
        <nav class="post-nav" id="postNav"></nav>
      </main>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug   = params.get('slug');
    const REPO_RAW = 'https://cdn.jsdelivr.net/gh/clararamalho/consultoria-financeira@main';

    async function iniciar() {
      if (!slug) { mostrarErro(); return; }
      try {
        // Forçar busca do arquivo local primeiro (agora com .nojekyll deve funcionar)
        let resMd = await fetch(`posts/${slug}.md?v=${Date.now()}`);
        
        if (!resMd.ok) {
           console.warn("Local falhou, tentando CDN...");
           resMd = await fetch(`${REPO_RAW}/posts/${slug}.md?v=${Date.now()}`);
        }

        if (!resMd.ok) throw new Error('404');

        const texto = await resMd.text();
        renderizarPost(texto);
      } catch (e) {
        console.error("Erro:", e);
        mostrarErro();
      }
    }

    function renderizarPost(texto) {
      const parts = texto.split('---');
      let meta = {};
      let conteudo = texto;

      if (parts.length >= 3) {
        const rawMeta = parts[1];
        conteudo = parts.slice(2).join('---');
        rawMeta.split('\n').forEach(line => {
          const [k, ...v] = line.split(':');
          if (k && v.length) meta[k.trim()] = v.join(':').trim().replace(/^"|"$/g, '');
        });
      }

      document.title = (meta.titulo || 'Post') + ' · Clara Ramalho';
      document.getElementById('postTitulo').textContent = meta.titulo || '';
      document.getElementById('postTag').textContent = meta.categoria || 'Newsletter';
      document.getElementById('postResumo').textContent = meta.resumo || '';
      document.getElementById('postData').textContent = meta.data || '';
      document.getElementById('breadcrumbTitulo').textContent = meta.titulo || 'Post';
      
      // Sanitização básica ou uso direto se confiável
      document.getElementById('postContent').innerHTML = marked.parse(conteudo);
      
      document.getElementById('postLoading').style.display = 'none';
      document.getElementById('postWrapper').style.display = 'block';
    }

    function mostrarErro() {
      document.getElementById('postLoading').style.display = 'none';
      document.getElementById('postErro').style.display    = 'block';
    }

    iniciar();
  </script>
</body>
</html>
