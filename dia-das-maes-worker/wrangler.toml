name            = "mothers-day-email"
main            = "src/index.ts"
compatibility_date = "2024-09-23"

# ── Cron Trigger ───────────────────────────────────────────────────────────
# 08h00 BRT (Brasília, UTC-3) = 11h00 UTC
# Formato: minuto hora dia mês dia-da-semana
# "0 11 9 5 *" → 11h00 UTC, dia 09, mês 05 (maio), qualquer dia da semana
[triggers]
crons = ["0 11 9 5 *"]

# ── Variáveis de ambiente (produção) ──────────────────────────────────────
# Configure os valores reais no Cloudflare Dashboard:
# Workers & Pages → mothers-day-email → Settings → Variables
#
# NÃO coloque valores reais aqui — use o Dashboard ou wrangler secret put
[vars]
# FROM_EMAIL  = "Clara Ramalho <newsletter@clararamalho.com.br>"
# AUDIENCE_ID = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
